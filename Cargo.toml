[package]
name = "oxide"
version = "0.6.2"
edition = "2024"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
alacritty_terminal = "=0.26.0"
# Same version alacritty_terminal uses; drives our own PTY event loop.
polling = "3"
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
directories = "5"
# Already pulled in by alacritty_terminal; column math for the markdown preview.
unicode-width = "0.2"
# Code-block highlighting in the markdown preview. two-face adds the grammars
# syntect's own set lacks — TOML above all. onig is syntect's default regex
# backend and the faster one; regex-fancy would also switch on bit-set/std,
# which sits under naga and so costs a full gpui (Metal shader) rebuild.
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
notify = "6"
notify-debouncer-full = "0.3"
ignore = "0.4"
trash = "5.2.9"

[target.'cfg(target_os = "macos")'.dependencies]
# Already pulled in by gpui; used for UNUserNotificationCenter. Kept off the
# Linux build: objc links against Apple's runtime (`objc_msgSend`), which
# GNU libobjc lacks, and block wants BlocksRuntime — both fail at link time.
objc = "0.2"
block = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
